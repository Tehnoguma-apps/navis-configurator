<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote NM-2026-143 – Variant B Structured Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1a1a2e; --blue: #2ea3f2; --gold: #c9a961; --ink: #262833; --muted: #6a6e7a; --line: #dfe3ea; --tint: #f1f4f8; --tint2: #f8f9fb; }
  .flow { color: var(--ink); font-size: 7.4pt; line-height: 1.36; font-variant-numeric: tabular-nums lining-nums; }

  /* Ledger: numbered rail + content on every block, so the rail rule runs down the page */
  .blk { display: grid; grid-template-columns: 21mm 1fr; }
  .blk.float > .rail { height: 0; overflow: visible; }
  .rail { border-right: .5pt solid var(--line); padding-right: 6pt; }
  .main { padding-left: 9pt; min-width: 0; }
  .blk.start { border-top: .9pt solid var(--navy); margin-top: 7pt; }
  .blk.start > .rail, .blk.start > .main { padding-top: 4.5pt; }
  .blk.first { margin-top: 0; }
  .rail .no { color: var(--blue); font-weight: 700; font-size: 8.6pt; line-height: 1; }
  .rail .t { color: var(--navy); font-weight: 600; font-size: 7.2pt; line-height: 1.22; margin-top: 2pt; }
  .rail .c { color: var(--muted); font-size: 6.2pt; margin-top: 1.5pt; line-height: 1.3; }
  .k { color: var(--muted); font-size: 6.3pt; }
  .pad-b { padding-bottom: 4pt; }

  /* 1 Parties */
  .parties { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10pt; }
  .parties .v { font-weight: 600; color: var(--navy); font-size: 8pt; }

  /* 2 Vessel + price at a glance */
  .vessel { display: grid; grid-template-columns: 1fr 58mm; gap: 12pt; }
  .vessel h1 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 17pt; color: var(--navy); line-height: 1.1; }
  .vessel .sub { color: var(--muted); font-size: 6.8pt; margin: 1pt 0 4pt; }
  .kv { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 12pt; }
  .kv div { display: flex; justify-content: space-between; gap: 6pt; padding: 1.7pt 0; border-bottom: .4pt solid var(--line); }
  .kv div span:first-child { color: var(--muted); font-size: 6.4pt; }
  .kv div span:last-child { color: var(--navy); font-weight: 500; text-align: right; }
  .glance { border: .9pt solid var(--navy); align-self: start; }
  .glance .hd { background: var(--navy); color: #fff; font-weight: 600; font-size: 7.2pt; padding: 3pt 7pt; display: flex; justify-content: space-between; }
  .glance .hd span:last-child { color: rgba(255,255,255,.65); font-weight: 400; }
  .glance .r { display: flex; justify-content: space-between; padding: 2.2pt 7pt; border-bottom: .4pt solid var(--line); }
  .glance .r.base { font-weight: 700; color: var(--navy); }
  .glance .r.disc span:last-child { color: #b03a2e; }
  .glance .tot { display: flex; justify-content: space-between; align-items: baseline; padding: 4pt 7pt; background: var(--tint); }
  .glance .tot .l { font-weight: 700; color: var(--navy); }
  .glance .tot .v { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 12pt; color: var(--navy); }

  /* 3 Standard equipment: four columns, rule between */
  .std { columns: 4; column-gap: 10pt; column-rule: .4pt solid var(--line); }
  .std section { break-inside: avoid; margin-bottom: 4pt; }
  .std h3 { font-size: 7pt; font-weight: 700; color: var(--navy); margin-bottom: 1pt; }
  .std h3 span { font-weight: 400; color: var(--muted); }
  .std li { list-style: none; font-size: 6.6pt; line-height: 1.34; color: var(--ink); }

  /* 4 Ledger table */
  .tr { display: grid; grid-template-columns: 14pt 1fr 16pt 48pt 38pt 52pt; column-gap: 6pt; padding: 1.5pt 4pt; align-items: baseline; }
  .tr > :nth-child(n+3) { text-align: right; }
  .tr .pos { color: var(--muted); font-size: 6.3pt; }
  .tr .d { color: #b6bac3; }
  .tr.zebra { background: var(--tint2); }
  .tr.th { font-size: 6.2pt; color: var(--muted); border-bottom: .6pt solid var(--navy); padding-top: 0; }
  .tr.cat { background: var(--tint); box-shadow: inset 0 .4pt 0 var(--line); margin-top: 2pt; font-weight: 600; color: var(--navy); padding-top: 2pt; padding-bottom: 2pt; }
  .tr.cat .cnt { font-weight: 400; color: var(--muted); }
  .tr.sum { border-top: .9pt solid var(--navy); font-weight: 700; color: var(--navy); margin-top: 2pt; padding-top: 3pt; }

  /* 5 Price calculation */
  .calc { display: grid; grid-template-columns: 1fr 66mm; gap: 14pt; }
  .calc .lines .r { display: grid; grid-template-columns: 1fr auto 60pt; gap: 8pt; padding: 1.9pt 0; border-bottom: .4pt solid var(--line); }
  .calc .lines .r span:nth-child(2) { color: var(--muted); text-align: right; }
  .calc .lines .r span:last-child { text-align: right; }
  .calc .lines .r.minus span:last-child { color: #b03a2e; }
  .calc .lines .r.b { font-weight: 700; color: var(--navy); border-bottom: .9pt solid var(--navy); }
  .calc .final { background: var(--navy); color: #fff; padding: 8pt 10pt; display: flex; flex-direction: column; justify-content: center; }
  .calc .final .l { font-size: 7pt; color: rgba(255,255,255,.75); }
  .calc .final .v { font-family: 'Playfair Display', serif; font-size: 18pt; color: #fff; line-height: 1.15; margin-top: 2pt; }
  .calc .final .rule { height: 1pt; background: var(--gold); width: 22pt; margin: 5pt 0; }
  .calc .final .ex { font-size: 6.6pt; color: rgba(255,255,255,.75); }
  .calc .final .ex b { color: #fff; font-weight: 600; }

  /* 6 Offer details */
  .trade { border-left: 2pt solid var(--blue); background: var(--tint); padding: 4pt 8pt; color: var(--navy); font-weight: 600; }

  /* 7 Payment */
  .plan { display: grid; grid-template-columns: repeat(3, 1fr); border: .5pt solid var(--line); margin-bottom: 5pt; }
  .plan .i { padding: 3pt 7pt; }
  .plan .i + .i { border-left: .5pt solid var(--line); }
  .plan .i .top { display: flex; justify-content: space-between; align-items: baseline; }
  .plan .i .p { color: var(--blue); font-weight: 700; font-size: 8.6pt; }
  .plan .i .a { color: var(--navy); font-weight: 600; }
  .pay { display: grid; grid-template-columns: 1fr 1.3fr 56pt; gap: 12pt; align-items: start; }
  .pay p { line-height: 1.45; }
  .pay .qr { text-align: center; font-size: 5.9pt; color: var(--muted); line-height: 1.3; }
  .pay .qr svg { display: block; margin: 0 auto 1pt; }

  /* 8 Terms */
  .terms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10pt; }
  .terms li { list-style: none; padding: 1.8pt 0; border-bottom: .4pt solid var(--line); }

  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; }
  .sign .box { border: .5pt solid var(--line); height: 34pt; }
  .sign .cap { display: flex; justify-content: space-between; margin-top: 2pt; font-size: 6.6pt; color: var(--muted); }
  .sign .cap b { color: var(--navy); font-weight: 600; }
  .note { margin-top: 8pt; padding-top: 4pt; border-top: .4pt solid var(--line); color: var(--muted); font-size: 6.8pt; display: flex; justify-content: space-between; }
  .note b { color: var(--navy); font-weight: 600; }
</style>
</head>
<body>
<script src="quote-143.js"></script>
<script src="paginate.js"></script>
<script>
(function () {
  const q = window.QUOTE, h = Pager.h, B = [];
  const add = (html, o) => B.push(Object.assign({ el: h(html) }, o || {}));
  const rail = (no, t, c) => `<div class="rail">${no ? `<div class="no">${no}</div><div class="t">${t}</div>${c ? `<div class="c">${c}</div>` : ''}` : ''}</div>`;
  const blk = (main, r, cls) => `<div class="blk ${cls || ''}">${r || rail()}<div class="main">${main}</div></div>`;

  add(blk(`<div class="parties pad-b">
      <div><div class="k">Customer</div><div class="v">${q.customer.name}</div></div>
      <div><div class="k">Offer made by</div><div class="v">${q.offerMadeBy.name}</div></div>
      <div><div class="k">Quote</div><div class="v">${q.number}</div><div class="k">Valid until ${q.validUntil}</div></div>
    </div>`, rail(1, 'Parties'), 'start first'));

  const kv = q.boat.key.concat(q.boat.specs.filter((s) => s[0] !== 'Engines' && s[0] !== 'Design'));
  add(blk(`<div class="vessel pad-b">
      <div><h1>${q.boat.name}</h1><div class="sub">Hull no. ${q.boat.hull}, design by Alberto Mancini and Achille Salvagni</div>
        <div class="kv">${kv.map((s) => `<div><span>${s[0]}</span><span>${s[1]}</span></div>`).join('')}</div></div>
      <div class="glance">
        <div class="hd"><span>Price at a glance</span><span>EUR, excl. VAT</span></div>
        <div class="r base"><span>Base price</span><span>${eur(q.boat.basePrice)}</span></div>
        <div class="r"><span>Optional equipment (${q.itemCount})</span><span>${eur(q.equipmentTotal)}</span></div>
        <div class="r disc"><span>Discount ${q.discount.boatPct} %</span><span>${eur(-q.discountTotal)}</span></div>
        <div class="r"><span>Total excl. VAT</span><span>${eur(q.net)}</span></div>
        <div class="tot"><span class="l">Total incl. VAT</span><span class="v">${eur(q.gross)}</span></div>
      </div></div>`, rail(2, 'Vessel', 'Details in sections 3 to 5'), 'start'));

  const stdCount = q.standard.reduce((s, g) => s + g[1].length, 0);
  add(blk(`<div class="std pad-b">${q.standard.map((g) => `<section><h3>${g[0]} <span>${g[1].length}</span></h3><ul>${g[1].map((i) => `<li>${i}</li>`).join('')}</ul></section>`).join('')}</div>`,
    rail(3, 'Standard equipment', `${stdCount} items, included in the base price`), 'start'));

  const th = `<div class="tr th"><span>No.</span><span>Item</span><span>Qty</span><span>Price</span><span>Discount</span><span>Net</span></div>`;
  const cont = (cat) => () => h(blk(th + (cat ? `<div class="tr cat"><span></span><span>${cat} <span class="cnt">(continued)</span></span></div>` : ''), rail(4, 'Optional equipment', 'continued'), 'start first float'));
  add(blk(th, rail(4, 'Optional equipment', `${q.itemCount} items in ${q.optional.length} categories`), 'start float'), { keep: true });
  let pos = 0;
  q.optional.forEach((c) => {
    add(blk(`<div class="tr cat"><span></span><span>${c[0]} <span class="cnt">(${c[1].length})</span></span><span></span><span></span><span></span><span>${eur(c.subtotal)}</span></div>`), { keep: true, cont: cont() });
    c[1].forEach((it, i) => {
      pos++;
      add(blk(`<div class="tr ${i % 2 ? 'zebra' : ''}"><span class="pos">${pos}</span><span>${it[0]}</span><span>1</span><span>${eur(it[1])}</span><span class="d">–</span><span>${eur(it[1])}</span></div>`),
        { keep: (i === 0 && c[1].length > 2) || i === c[1].length - 2, cont: cont(c[0]) });
    });
  });
  add(blk(`<div class="tr sum"><span></span><span>Optional equipment total</span><span>${q.itemCount}</span><span></span><span></span><span>${eur(q.equipmentTotal)}</span></div>`));

  add(blk(`<div class="calc pad-b"><div class="lines">
      <div class="r"><span>Base price, ${q.boat.name}</span><span></span><span>${eur(q.boat.basePrice)}</span></div>
      <div class="r"><span>Optional equipment</span><span>${q.itemCount} items</span><span>${eur(q.equipmentTotal)}</span></div>
      <div class="r b"><span>Total list price</span><span></span><span>${eur(q.listTotal)}</span></div>
      <div class="r minus"><span>Boat discount</span><span>${q.discount.boatPct} %</span><span>${eur(-q.boatDiscount)}</span></div>
      <div class="r minus"><span>Equipment discount</span><span>${q.discount.equipmentPct} %</span><span>${eur(-q.equipmentDiscount)}</span></div>
      <div class="r b"><span>Total excl. VAT</span><span></span><span>${eur(q.net)}</span></div>
      <div class="r"><span>VAT</span><span>${q.vatPct} %</span><span>${eur(q.vat)}</span></div>
    </div>
    <div class="final"><div class="l">Total incl. VAT</div><div class="v">${eur(q.gross)}</div><div class="rule"></div>
      <div class="ex">Total excl. VAT <b>${eur(q.net)}</b></div></div>
    </div>`, rail(5, 'Price calculation'), 'start'));

  add(blk(`<div class="pad-b"><div class="trade">${q.tradeIn}</div></div>`, rail(6, 'Offer details'), 'start'));

  add(blk(`<div class="pad-b"><div class="plan">${q.paymentTerms.map((p) => `<div class="i"><div class="top"><span class="p">${p[1]} %</span><span class="a">${eur(q.gross * p[1] / 100)}</span></div><div class="k">${p[0]}</div></div>`).join('')}</div>
    <div class="pay">
      <div><div class="k">Recipient</div><p>${q.seller.name}<br>${q.seller.street}, ${q.seller.city}<br>OIB ${q.seller.oib}</p></div>
      <div><div class="k">Payment details</div><p>IBAN ${q.seller.iban}<br>BIC/SWIFT ${q.seller.bic}, ${q.seller.bank}<br>Reference ${q.number}</p></div>
      <div class="qr">${Pager.qr('48pt')}Advance ${q.depositPct} %<br>${eur(q.deposit)}</div>
    </div></div>`, rail(7, 'Payment', 'Terms and details'), 'start'), { keep: true });

  add(blk(`<ul class="terms pad-b">${q.deliveryTerms.map((t) => `<li>${t}</li>`).join('')}</ul>`, rail(8, 'Terms of delivery'), 'start'), { keep: true });
  add(blk(`<div class="sign">
      <div><div class="box"></div><div class="cap"><span>Signature for buyer</span><b>${q.customer.name}</b></div></div>
      <div><div class="box"></div><div class="cap"><span>Signature for seller</span><b>${q.seller.name}</b></div></div>
    </div><div class="note"><b>This quotation is not an invoice.</b><span>${q.number}, issued ${q.date}, valid until ${q.validUntil}</span></div>`,
    rail(9, 'Acceptance'), 'start'));

  Pager.run(q, B);
})();
</script>
</body>
</html>
