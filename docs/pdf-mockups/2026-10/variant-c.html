<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote NM-2026-143 – Variant C Navy Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1a1a2e; --gold: #c9a961; --gold-ink: #8f733b; --ink: #2a2a2a; --muted: #6b6f7d; --line: #e3e5ec; --card: #f4f5f9; }
  .flow { color: var(--ink); font-size: 7.4pt; line-height: 1.36; font-variant-numeric: tabular-nums lining-nums; }

  /* Section band */
  .band { display: flex; justify-content: space-between; align-items: center; background: var(--navy); color: #fff; padding: 3pt 9pt; margin: 9pt 0 5pt; border-bottom: 1.2pt solid var(--gold); }
  .band h2 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 9.6pt; letter-spacing: .01em; }
  .band span { font-size: 6.6pt; color: rgba(255,255,255,.72); }
  .band span b { color: var(--gold); font-weight: 600; }

  /* Parties */
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; margin-bottom: 7pt; }
  .parties > div { border-left: 1.5pt solid var(--gold); padding: 0 0 0 8pt; }
  .parties .k { font-size: 6.3pt; color: var(--muted); }
  .parties .v { font-family: 'Playfair Display', serif; font-size: 10.5pt; color: var(--navy); line-height: 1.25; }

  /* Boat block: navy panel, base price in gold */
  .boat { background: var(--navy); color: #fff; padding: 9pt 12pt 8pt; border-bottom: 1.2pt solid var(--gold); }
  .boat .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12pt; padding-bottom: 6pt; border-bottom: .5pt solid rgba(201,169,97,.5); }
  .boat h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 20pt; line-height: 1.05; }
  .boat .hull { font-size: 6.8pt; color: rgba(255,255,255,.65); margin-top: 2pt; }
  .boat .price { text-align: right; }
  .boat .price .k { font-size: 6.4pt; color: rgba(255,255,255,.65); }
  .boat .price .v { font-family: 'Playfair Display', serif; font-size: 16pt; color: var(--gold); line-height: 1.1; }
  .boat dl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4pt 10pt; padding-top: 6pt; }
  .boat dt { font-size: 5.9pt; color: rgba(255,255,255,.55); }
  .boat dd { font-size: 7.1pt; color: #fff; font-weight: 500; }

  /* Standard equipment: one tinted panel, four columns */
  .std { background: var(--card); padding: 6pt 9pt 3pt; columns: 4; column-gap: 12pt; }
  .std section { break-inside: avoid; margin-bottom: 4pt; }
  .std h3 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 8pt; color: var(--navy); padding-bottom: 1pt; margin-bottom: 1.5pt; border-bottom: .6pt solid var(--gold); }
  .std li { list-style: none; font-size: 6.6pt; line-height: 1.34; padding-left: 6pt; position: relative; }
  .std li::before { content: ''; position: absolute; left: 0; top: .55em; width: 2.2pt; height: 2.2pt; background: var(--gold); transform: rotate(45deg); }

  /* Category cards */
  .ch { display: grid; grid-template-columns: 1fr auto; align-items: baseline; background: var(--card); border: .6pt solid var(--line); border-bottom: .6pt solid #cfd3de; padding: 2.6pt 8pt; margin-top: 5pt; }
  .ch .n { font-weight: 700; color: var(--navy); font-size: 7.6pt; }
  .ch .n span { font-weight: 400; color: var(--muted); margin-left: 4pt; font-size: 6.5pt; }
  .ch .s { font-size: 6.5pt; color: var(--muted); }
  .ch .s b { color: var(--gold-ink); font-weight: 700; font-size: 7.6pt; margin-left: 5pt; }
  .r { display: grid; grid-template-columns: 1fr 18pt 50pt 38pt 54pt; column-gap: 6pt; padding: 1.6pt 8pt; border-left: .6pt solid var(--line); border-right: .6pt solid var(--line); align-items: baseline; }
  .r + .r { box-shadow: inset 0 .4pt 0 #e9ebf1; }
  .r > :nth-child(n+2) { text-align: right; }
  .r .d { color: #b6b9c3; }
  .r.last { border-bottom: .6pt solid var(--line); }
  .r.th { border: 0; padding-top: 0; padding-bottom: 1pt; font-size: 6.2pt; color: var(--muted); }
  .eqsum { margin-top: 5pt; display: flex; justify-content: flex-end; align-items: baseline; gap: 12pt; color: var(--navy); padding-right: 8pt; }
  .eqsum b { font-size: 8.4pt; }

  /* Totals */
  .totals { display: grid; grid-template-columns: 1fr 68mm; border: .6pt solid var(--line); }
  .totals .lines { padding: 4pt 10pt; }
  .totals .l { display: flex; justify-content: space-between; padding: 2pt 0; border-bottom: .4pt solid #eef0f4; }
  .totals .l.disc span:last-child { color: #a3392b; }
  .totals .l.sub { font-size: 6.5pt; color: var(--muted); padding: 1pt 0 1pt 9pt; border: 0; }
  .totals .l.net { font-weight: 700; color: var(--navy); border-top: .8pt solid var(--navy); margin-top: 1pt; }
  .totals .l:last-child { border-bottom: 0; }
  .totals .grand { background: var(--navy); color: #fff; padding: 9pt 12pt; display: flex; flex-direction: column; justify-content: center; border-left: 2pt solid var(--gold); }
  .totals .grand .k { font-size: 7pt; color: rgba(255,255,255,.72); }
  .totals .grand .v { font-family: 'Playfair Display', serif; font-size: 18pt; color: var(--gold); line-height: 1.15; margin: 2pt 0 5pt; }
  .totals .grand .x { font-size: 6.6pt; color: rgba(255,255,255,.72); padding-top: 4pt; border-top: .5pt solid rgba(255,255,255,.2); }
  .totals .grand .x b { color: #fff; font-weight: 600; }

  /* Offer details + terms of delivery */
  .trade { background: var(--card); border-left: 2pt solid var(--gold); padding: 5pt 10pt; display: flex; align-items: baseline; gap: 10pt; }
  .trade .k { font-size: 6.3pt; color: var(--muted); }
  .trade .v { font-family: 'Playfair Display', serif; font-size: 9.6pt; color: var(--navy); }
  .terms { display: flex; gap: 22pt; padding: 0 2pt; }
  .terms li { list-style: none; padding-left: 9pt; position: relative; }
  .terms li::before { content: ''; position: absolute; left: 0; top: .5em; width: 3pt; height: 3pt; background: var(--gold); transform: rotate(45deg); }

  /* Payment */
  .plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6pt; margin-bottom: 6pt; }
  .plan .i { border-top: 1.5pt solid var(--gold); background: var(--card); padding: 3.5pt 8pt; }
  .plan .i .top { display: flex; justify-content: space-between; align-items: baseline; }
  .plan .i .p { font-family: 'Playfair Display', serif; font-size: 11pt; color: var(--navy); }
  .plan .i .a { font-weight: 700; color: var(--navy); }
  .plan .k, .pay .k { font-size: 6.3pt; color: var(--muted); }
  .pay { display: grid; grid-template-columns: 1fr 1.3fr 62pt; gap: 12pt; align-items: start; }
  .pay p { line-height: 1.45; }
  .pay .qr { border: .6pt solid var(--navy); padding: 3pt; text-align: center; font-size: 5.9pt; color: var(--muted); line-height: 1.3; }
  .pay .qr svg { display: block; margin: 0 auto 1pt; }

  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 14pt; margin-top: 12pt; }
  .sign > div { border: .6pt solid var(--line); padding: 5pt 8pt; height: 50pt; display: flex; flex-direction: column; justify-content: space-between; }
  .sign .k { font-size: 6.3pt; color: var(--muted); }
  .sign .v { color: var(--navy); font-weight: 600; border-top: .6pt solid var(--navy); padding-top: 2pt; }
  .notinv { margin-top: 9pt; text-align: center; font-size: 7pt; color: var(--navy); }
  .notinv span { display: inline-block; padding: 2.5pt 10pt; border-top: .6pt solid var(--gold); border-bottom: .6pt solid var(--gold); }
</style>
</head>
<body>
<script src="quote-143.js"></script>
<script src="paginate.js"></script>
<script>
(function () {
  const q = window.QUOTE, h = Pager.h, B = [];
  const add = (html, o) => B.push(Object.assign({ el: h(html) }, o || {}));
  const band = (t, aside) => `<div class="band"><h2>${t}</h2>${aside ? `<span>${aside}</span>` : ''}</div>`;
  const th = `<div class="r th"><span>Item</span><span>Qty</span><span>Price</span><span>Discount</span><span>Net</span></div>`;
  const cont = (cat) => () => h(`<div>${band('Optional equipment', 'continued')}${th}${cat ? `<div class="ch"><span class="n">${cat}<span>continued</span></span><span class="s"></span></div>` : ''}</div>`);

  add(`<div class="parties">
    <div><div class="k">Customer</div><div class="v">${q.customer.name}</div></div>
    <div><div class="k">Offer made by</div><div class="v">${q.offerMadeBy.name}</div></div></div>`);
  const specs = q.boat.key.filter((s) => s[0] !== 'Shipyard').concat(q.boat.specs.filter((s) => s[0] !== 'Engines' && s[0] !== 'Design' && s[0] !== 'Heads'));
  add(`<div class="boat">
    <div class="top"><div><h1>${q.boat.name}</h1><div class="hull">Hull no. ${q.boat.hull}, ${q.boat.builder}. Design by Alberto Mancini and Achille Salvagni</div></div>
      <div class="price"><div class="k">Base price excl. VAT</div><div class="v">${eur(q.boat.basePrice)}</div></div></div>
    <dl>${specs.map((s) => `<div><dt>${s[0]}</dt><dd>${s[1]}</dd></div>`).join('')}</dl></div>`);

  add(band('Standard equipment', 'Included in the base price'), { keep: true });
  add(`<div class="std">${q.standard.map((g) => `<section><h3>${g[0]}</h3><ul>${g[1].map((i) => `<li>${i}</li>`).join('')}</ul></section>`).join('')}</div>`);

  add(band('Optional equipment', `${q.itemCount} items, total <b>${eur(q.equipmentTotal)}</b>`), { keep: true });
  add(th, { keep: true });
  q.optional.forEach((c) => {
    add(`<div class="ch"><span class="n">${c[0]}<span>${c[1].length} ${c[1].length === 1 ? 'item' : 'items'}</span></span><span class="s">Subtotal<b>${eur(c.subtotal)}</b></span></div>`, { keep: true, cont: cont() });
    c[1].forEach((it, i) => add(`<div class="r ${i === c[1].length - 1 ? 'last' : ''}"><span>${it[0]}</span><span>1</span><span>${eur(it[1])}</span><span class="d">–</span><span>${eur(it[1])}</span></div>`,
      { keep: (i === 0 && c[1].length > 2) || i === c[1].length - 2, cont: cont(c[0]) }));
  });
  add(`<div class="eqsum"><span>Optional equipment total</span><b>${eur(q.equipmentTotal)}</b></div>`);

  add(band('Price summary'), { keep: true });
  add(`<div class="totals"><div class="lines">
      <div class="l"><span>Base price</span><span>${eur(q.boat.basePrice)}</span></div>
      <div class="l"><span>Optional equipment</span><span>${eur(q.equipmentTotal)}</span></div>
      <div class="l"><span>Total list price</span><span>${eur(q.listTotal)}</span></div>
      <div class="l disc"><span>Discount ${q.discount.boatPct} %</span><span>${eur(-q.discountTotal)}</span></div>
      <div class="l sub"><span>Boat ${q.discount.boatPct} %, optional equipment ${q.discount.equipmentPct} %</span><span>${eur(-q.boatDiscount)} / ${eur(-q.equipmentDiscount)}</span></div>
      <div class="l net"><span>Total excl. VAT</span><span>${eur(q.net)}</span></div>
      <div class="l"><span>VAT ${q.vatPct} %</span><span>${eur(q.vat)}</span></div>
    </div><div class="grand"><div class="k">Total incl. VAT</div><div class="v">${eur(q.gross)}</div>
      <div class="x">Total excl. VAT <b>${eur(q.net)}</b></div></div></div>`);

  add(band('Offer details'), { keep: true });
  add(`<div class="trade"><span class="k">Trade-in</span><span class="v">${q.tradeIn.replace('Trade-in ', '')}</span></div>`);

  add(band('Payment'), { keep: true });
  add(`<div><div class="plan">${q.paymentTerms.map((p) => `<div class="i"><div class="top"><span class="p">${p[1]} %</span><span class="a">${eur(q.gross * p[1] / 100)}</span></div><div class="k">${p[0]}</div></div>`).join('')}</div>
  <div class="pay">
    <div><div class="k">Recipient</div><p>${q.seller.name}<br>${q.seller.street}<br>${q.seller.city}<br>OIB ${q.seller.oib}</p></div>
    <div><div class="k">Payment details</div><p>IBAN ${q.seller.iban}<br>BIC/SWIFT ${q.seller.bic}<br>${q.seller.bank}<br>Reference ${q.number}</p></div>
    <div class="qr">${Pager.qr('52pt')}Advance ${q.depositPct} %<br>${eur(q.deposit)}</div>
  </div></div>`, { keep: true });

  add(band('Terms of delivery'), { keep: true });
  add(`<ul class="terms">${q.deliveryTerms.map((t) => `<li>${t}</li>`).join('')}</ul>`, { keep: true });
  add(`<div><div class="sign">
    <div><span class="k">Signature for buyer</span><span class="v">${q.customer.name}</span></div>
    <div><span class="k">Signature for seller</span><span class="v">${q.seller.name}</span></div>
  </div><p class="notinv"><span>This quotation is not an invoice.</span></p></div>`);

  Pager.run(q, B);
})();
</script>
</body>
</html>
